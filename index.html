<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dijital Dolap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f0e0d;--ink2:#6b6560;--ink3:#b0aba6;
  --cream:#faf8f5;--paper:#fff;--line:#eae6e1;--line2:#d4cfc9;
  --rose:#c9626a;--rose-bg:#fdf0f1;--rose-line:#f0c4c7;
  --sage:#4a7c6f;--sage-bg:#eef5f3;--sage-line:#b8d8d2;
  --amber:#b07030;--amber-bg:#fdf4e8;--amber-line:#f0d4a0;
  --indigo:#4a5fa0;--indigo-bg:#f0f2fa;--indigo-line:#c4ccec;
  --r:12px;--rs:8px;--rx:20px;
}
body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
.header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;gap:10px;padding:0 18px;height:56px;max-width:1060px;margin:0 auto}
.logo{font-family:'Playfair Display',serif;font-size:20px;white-space:nowrap}
.logo em{font-style:italic;color:var(--ink2)}
.searchbox{flex:1;max-width:280px;position:relative;display:none}
.searchbox input{width:100%;border:1px solid var(--line2);border-radius:var(--rx);padding:7px 14px 7px 32px;font-size:13px;background:var(--cream);font-family:'Inter',sans-serif;outline:none;color:var(--ink)}
.searchbox input:focus{border-color:var(--ink);background:var(--paper)}
.sico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px}
.hright{display:flex;align-items:center;gap:7px;margin-left:auto}
.dsk-nav{display:none;gap:1px;background:var(--cream);border:1px solid var(--line);border-radius:var(--rx);padding:3px}
.dsk-nav button{background:transparent;border:none;padding:5px 11px;border-radius:calc(var(--rx) - 2px);font-family:'Inter',sans-serif;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.dsk-nav button.on{background:var(--paper);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nbtn{background:transparent;border:1px solid var(--line2);border-radius:50%;width:34px;height:34px;font-size:14px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.ndot{position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--rose);border-radius:50%;border:2px solid var(--paper);display:none}
.ndot.on{display:block}
.upill{display:flex;align-items:center;gap:6px;background:var(--cream);border:1px solid var(--line2);border-radius:var(--rx);padding:4px 12px 4px 7px;font-size:13px;font-weight:500;cursor:pointer}
.uav{width:22px;height:22px;border-radius:50%;background:var(--indigo-bg);border:1px solid var(--indigo-line);display:flex;align-items:center;justify-content:center;font-size:12px}
@media(min-width:720px){.dsk-nav{display:flex}}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;background:transparent;border:none;padding:8px 2px 6px;font-family:'Inter',sans-serif;font-size:9px;font-weight:500;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.ni{font-size:18px;line-height:1}
.bnav button.on{color:var(--rose)}
@media(min-width:720px){.bnav{display:none}}
.page{max-width:1060px;margin:0 auto;padding:22px 18px 110px}
@media(min-width:720px){.page{padding:28px 22px 60px}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card+.card{margin-top:13px}
.ctitle{font-size:15px;font-weight:600;margin-bottom:4px}
.csub{font-size:13px;color:var(--ink2);margin-bottom:16px;line-height:1.5}
.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stitle{font-family:'Playfair Display',serif;font-size:21px;font-weight:600}
.spill{font-size:12px;color:var(--ink2);background:var(--line);padding:3px 11px;border-radius:var(--rx)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:540px){.fg{grid-template-columns:1fr}}
.fi{display:flex;flex-direction:column;gap:5px}
.fi.full{grid-column:1/-1}
label{font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--line2);border-radius:var(--rs);padding:8px 11px;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:var(--cream);outline:none;transition:.15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ink);background:var(--paper)}
textarea{resize:vertical;min-height:68px}
.ff{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.pzone{border:1.5px dashed var(--line2);border-radius:var(--r);overflow:hidden;cursor:pointer;min-height:148px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--cream)}
.pzone:hover{border-color:var(--ink)}
.pzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pzi{text-align:center;padding:22px;pointer-events:none}
.pzi svg{opacity:.25}
.pzi p{font-size:14px;color:var(--ink2);margin-top:8px;font-weight:500}
.pzi small{font-size:12px;color:var(--ink3);margin-top:3px;display:block}
.preview{width:100%;max-height:220px;object-fit:cover;display:none}
.btn{border:none;border-radius:var(--rs);padding:8px 16px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{opacity:.85}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--ink2)}.btn-ghost:hover{border-color:var(--ink);color:var(--ink)}
.btn-rose{background:var(--rose-bg);color:var(--rose);border:1px solid var(--rose-line)}
.btn-sage{background:var(--sage-bg);color:var(--sage);border:1px solid var(--sage-line)}
.btn-indigo{background:var(--indigo-bg);color:var(--indigo);border:1px solid var(--indigo-line)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-ico{width:30px;height:30px;padding:0;border-radius:50%;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:var(--rx);padding:4px 13px;font-size:12px;font-weight:500;font-family:'Inter',sans-serif;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}
.cc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.cc:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
.cc.stored{opacity:.6}
.cthumb{width:100%;height:165px;object-fit:cover;display:block}
.cph{height:165px;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(135deg,var(--cream),var(--line))}
.cbody{padding:9px 11px 3px}
.cname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:11px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clast{font-size:11px;color:var(--ink3);padding:2px 11px 3px}
.ccpg{font-size:11px;padding:1px 11px 3px;font-weight:600}
.wbtn{width:100%;border:none;border-top:1px solid var(--line);background:transparent;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;color:var(--ink3);padding:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.wbtn:hover,.wbtn.worn{background:var(--sage-bg);color:var(--sage)}
.ctag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--rx);border:1px solid}
.tag-old{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.tag-nw{background:var(--rose-bg);color:var(--rose);border-color:var(--rose-line)}
.tag-warn{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.tag-stored{background:#f0f0f0;color:#888;border-color:#ddd}
.delbtn{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:50%;width:26px;height:26px;display:none;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.cc:hover .delbtn{display:flex}
.ais{display:none;align-items:center;gap:7px;padding:9px 13px;background:var(--indigo-bg);border:1px solid var(--indigo-line);border-radius:var(--rs);margin-top:9px;font-size:13px;color:var(--indigo)}
.dot{width:6px;height:6px;background:currentColor;border-radius:50%;animation:pulse 1.2s ease-in-out infinite;flex-shrink:0}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}
.olayout{display:grid;grid-template-columns:230px 1fr;gap:14px}
@media(max-width:660px){.olayout{grid-template-columns:1fr}}
.opanel,.ores{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.ores{min-height:260px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px;margin-bottom:12px}
.oitem{border:1px solid var(--line);border-radius:var(--rs);overflow:hidden}
.oitem img{width:100%;height:95px;object-fit:cover;display:block}
.oiph{height:95px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--cream)}
.oilbl{font-size:11px;color:var(--ink2);padding:5px 7px;text-align:center;line-height:1.4;font-weight:500}
.aic{background:var(--cream);border-radius:var(--rs);border-left:3px solid var(--indigo-line);padding:11px 13px;font-size:13px;line-height:1.8;margin-top:11px;color:var(--ink2)}
.rph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--ink3);text-align:center;gap:9px;font-size:14px}
.sog{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:20px}
.soc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.socname{font-size:13px;font-weight:600}
.sococc{font-size:11px;color:var(--ink3);margin-top:2px;margin-bottom:10px}
.socthumbs{display:flex;gap:5px}
.sot{width:54px;height:54px;object-fit:cover;border-radius:var(--rs);flex-shrink:0}
.sotph{width:54px;height:54px;background:var(--cream);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1px solid var(--line)}
.bhero{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.bhero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--sage),var(--indigo))}
.bpbar-wrap{height:7px;background:var(--cream);border-radius:99px;overflow:hidden;margin-bottom:13px;border:1px solid var(--line)}
.bpbar{height:100%;border-radius:99px;transition:width .7s}
.bsr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bst{background:var(--cream);border-radius:var(--rs);padding:11px 13px;border:1px solid var(--line)}
.bstn{font-size:16px;font-weight:600;margin-bottom:2px}
.bstl{font-size:11px;color:var(--ink2);font-weight:500}
.slist{display:flex;flex-direction:column;gap:8px}
.si{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:11px}
.si.bought{opacity:.45}
.sichk{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:11px;font-weight:700}
.sichk.on{background:var(--sage);border-color:var(--sage);color:#fff}
.siinfo{flex:1;min-width:0}
.siname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.simeta{font-size:11px;color:var(--ink3);margin-top:2px}
.siprice{font-size:13px;font-weight:600;flex-shrink:0}
.pdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.ph{background:var(--rose)}.pn{background:var(--amber)}.pl{background:var(--sage)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px;margin-bottom:18px}
.sbox{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.sbox-accent{position:absolute;top:0;left:0;right:0;height:3px}
.snum{font-family:'Playfair Display',serif;font-size:30px;font-weight:600;line-height:1;margin-bottom:4px}
.slbl{font-size:12px;color:var(--ink2);font-weight:500}
.catlist{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.catrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.catname{font-size:13px;color:var(--ink2);width:135px;flex-shrink:0;font-weight:500}
.catbg{flex:1;height:6px;background:var(--cream);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.catfill{height:100%;border-radius:99px;transition:width .7s}
.catcnt{font-size:13px;font-weight:600;width:22px;text-align:right;flex-shrink:0}
.mback{position:fixed;inset:0;background:rgba(15,14,13,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:580px){.mback{align-items:center;padding:20px}}
.modal{background:var(--paper);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:22px;border:1px solid var(--line)}
@media(min-width:580px){.modal{border-radius:var(--r)}}
.mhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mtitle{font-size:15px;font-weight:600}
.mclose{background:transparent;border:1px solid var(--line);border-radius:50%;width:28px;height:28px;font-size:13px;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center}
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:8px 18px;border-radius:var(--rx);z-index:999;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:720px){#toast{bottom:28px}}
.empty{text-align:center;padding:50px 20px;color:var(--ink3);grid-column:1/-1}
.ei{font-size:42px;margin-bottom:10px;opacity:.5}
.alert{border-radius:var(--rs);padding:12px 15px;margin-bottom:13px;display:flex;gap:10px;align-items:flex-start;border:1px solid;font-size:13px}
.alert-rose{background:var(--rose-bg);border-color:var(--rose-line);color:var(--rose)}
.alert-amber{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.alert-sage{background:var(--sage-bg);border-color:var(--sage-line);color:var(--sage)}
.alert-indigo{background:var(--indigo-bg);border-color:var(--indigo-line);color:var(--indigo)}
.toggle{position:relative;width:38px;height:21px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.tslider{position:absolute;inset:0;background:var(--line2);border-radius:99px;cursor:pointer;transition:.2s}
.tslider::before{content:'';position:absolute;width:15px;height:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.tslider{background:var(--sage)}
.toggle input:checked+.tslider::before{transform:translateX(17px)}
.btabs{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.btab{flex:1;border:none;background:var(--cream);padding:11px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line)}
.btab:last-child{border-right:none}
.btab.on{background:var(--paper);color:var(--ink)}
.bpane{display:none}.bpane.on{display:block}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:12px}
.cal-day{aspect-ratio:1;border-radius:var(--rs);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:1px solid transparent;position:relative}
.cal-day:hover{background:var(--cream);border-color:var(--line)}
.cal-day.has-outfit{background:var(--indigo-bg);border-color:var(--indigo-line);color:var(--indigo)}
.cal-day.today{border-color:var(--ink)!important;font-weight:700}
.cal-day .dn{font-size:12px;line-height:1}
.cal-day .de{font-size:9px;margin-top:1px;line-height:1}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.cal-hdr span{text-align:center;font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px;margin-bottom:18px}
.ic{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.ic::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px}
.ic.rose::before{background:var(--rose)}.ic.sage::before{background:var(--sage)}.ic.amber::before{background:var(--amber)}.ic.indigo::before{background:var(--indigo)}
.iico{font-size:22px;margin-bottom:7px}
.ititle{font-size:13px;font-weight:600;margin-bottom:3px}
.ibody{font-size:12px;color:var(--ink2);line-height:1.6}
.cpwl{display:flex;flex-direction:column;gap:7px}
.cpwi{display:flex;align-items:center;gap:11px;background:var(--paper);border:1px solid var(--line);border-radius:var(--rs);padding:10px 13px}
.cpwr{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
/* SHARE BANNER */
.share-hero{background:linear-gradient(135deg,var(--indigo-bg),var(--sage-bg));border:1px solid var(--indigo-line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;gap:14px}
.share-hero-ico{font-size:32px;flex-shrink:0}
.share-hero-body{flex:1;min-width:0}
.share-hero-title{font-size:14px;font-weight:600;margin-bottom:3px}
.share-hero-sub{font-size:12px;color:var(--ink2);line-height:1.5}
/* GUEST BANNER */
.guest-banner{background:linear-gradient(135deg,#f0f4ff,#e8f5f0);border:2px solid var(--indigo-line);border-radius:var(--r);padding:22px 24px;text-align:center;margin-bottom:20px}
.guest-banner-ico{font-size:48px;margin-bottom:10px}
.guest-banner-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;margin-bottom:6px}
.guest-banner-sub{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:16px}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="logo">Dijital <em>Dolap</em></div>
    <div class="searchbox" id="searchBox">
      <span class="sico">🔍</span>
      <input type="text" id="searchIn" placeholder="İsim, renk, marka..." oninput="onSearch(this.value)">
    </div>
    <div class="hright">
      <nav class="dsk-nav" id="dskNav">
        <button onclick="tab('add',this)" class="on">+ Ekle</button>
        <button onclick="tab('bulk',this)">📦 Toplu</button>
        <button onclick="tab('wardrobe',this)">Dolabım</button>
        <button onclick="tab('outfit',this)">Kombin</button>
        <button onclick="tab('calendar',this)">📅 Takvim</button>
        <button onclick="tab('shopping',this)">Alışveriş</button>
        <button onclick="tab('insights',this)">💡 Analiz</button>
        <button onclick="tab('stats',this)">İstatistik</button>
      </nav>
      <button class="nbtn" onclick="openNotif()">🔔<span class="ndot" id="ndot"></span></button>
      <div class="upill" onclick="openUser()">
        <div class="uav" id="hav">👤</div>
        <span id="hname">Ben</span>
      </div>
    </div>
  </div>
</header>
<div class="page" id="page"></div>
<nav class="bnav" id="bnav">
  <button onclick="tab('add',this)" class="on"><span class="ni">➕</span>Ekle</button>

// ── CONSTANTS ─────────────────────────────────
const CE = {'Tişört':'👕','Gömlek':'👔','Kazak / Sweatshirt':'🧥','Ceket / Mont':'🧥','Jean / Pantolon':'👖','Etek':'👗','Elbise / Tulum':'👗','Spor kıyafet':'🩱','Şort':'🩳','Ayakkabı':'👟','Çanta':'👜','Aksesuar':'🧣','Diğer':'👚'};
const CATS = Object.keys(CE);
const CCOLS = ['#4a5fa0','#4a7c6f','#c9626a','#b07030','#4a5fa0','#c9626a','#b07030','#4a5fa0','#4a7c6f','#b07030','#4a5fa0','#c9626a','#4a7c6f'];

let clothes = S.get(KEYS.clothes) || [];
let outfits = S.get(KEYS.outfits) || [];
let shopping = S.get(KEYS.shopping) || [];
let me = S.get(KEYS.user) || null;
let wornLog = S.get(KEYS.log) || {};

let isGuest = false; // true = shared/read-only mode

// ── HELPERS ───────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const today = () => new Date().toISOString().slice(0,10);
const currYear = () => new Date().getFullYear();
const isOld = c => c.date && (Date.now()-new Date(c.date))/(864e5*365) >= 3;
const daysWorn = c => c.lastWorn ? Math.floor((Date.now()-new Date(c.lastWorn))/864e5) : null;
const wornToday = c => c.lastWorn === today();
const wornLbl = c => { if(wornToday(c)) return '✓ Bugün'; const d=daysWorn(c); if(d===null) return 'Hiç giyilmedi'; if(d===1) return 'Dün'; return d+' gün önce'; };
const fmtP = n => n ? Number(n).toLocaleString('tr-TR')+'₺' : '—';
const yearBudget = () => S.get('dd-budget') || 0;
const clothesSpent = () => clothes.filter(c=>c.buyPrice&&c.buyYear===currYear()).reduce((s,c)=>s+(Number(c.buyPrice)||0),0);
const shopSpent = () => shopping.filter(i=>i.bought&&i.boughtYear===currYear()).reduce((s,i)=>s+(Number(i.boughtPrice)||0),0);
const totalSpent = () => clothesSpent() + shopSpent();
const budgetLeft = () => yearBudget() - totalSpent();
const cpw = c => c.buyPrice && c.wornCount > 0 ? Math.round(c.buyPrice/c.wornCount) : null;
const catSel = () => CATS.map(c=>`<option>${c}</option>`).join('');
function save() {
  if(isGuest) return; // misafir değişiklik yapamaz
  S.set(KEYS.clothes,clothes); S.set(KEYS.outfits,outfits);
  S.set(KEYS.shopping,shopping); S.set(KEYS.log,wornLog);
}

let tTimer;
function toast(msg) {
  const el=document.getElementById('toast'); el.textContent=msg;
  el.classList.add('on'); clearTimeout(tTimer);
  tTimer=setTimeout(()=>el.classList.remove('on'),2800);
}

function openModal(html) {
  document.getElementById('modal')?.remove();
  const el=document.createElement('div'); el.className='mback'; el.id='modal';
  el.innerHTML=`<div class="modal">${html}</div>`;
  el.onclick=e=>{if(e.target===el)el.remove();};
  document.body.appendChild(el);
}
function closeModal() { document.getElementById('modal')?.remove(); }

function budgetToast(spend) {
  if(!yearBudget()) return;
  const left=budgetLeft();
  if(left<0) toast(`🚨 Bütçe aşıldı! ${fmtP(Math.abs(left))} fazla.`);
  else if(left<yearBudget()*.15) toast(`⚠️ Bütçenin %85'i doldu! ${fmtP(left)} kaldı.`);
  else toast(`✅ Eklendi! Bütçeden ${fmtP(spend)} düşüldü.`);
}

// ── SHARE PANEL (sahip için) ──────────────────
// Fotoğrafı paylaşım için küçük boyuta sıkıştır
function compressForShare(b64, maxPx=200, quality=0.30) {
  return new Promise(resolve => {
    if(!b64) { resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > maxPx || h > maxPx) {
        if(w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
        else { w = Math.round(w * maxPx / h); h = maxPx; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(null);
    img.src = b64;
  });
}

// 6 haneli büyük harf + rakam kod üret
function genShareCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(6)))
    .map(b => chars[b % chars.length]).join('');
}

async function renderSharePanel() {
  openModal(`
    <div class="mhdr"><div class="mtitle">📤 Dolabı Paylaş</div><button class="mclose" onclick="closeModal()">✕</button></div>
    <div style="display:flex;align-items:center;gap:9px;padding:24px 0;color:var(--ink2);font-size:13px;justify-content:center;">
      <div class="dot" style="background:var(--indigo)"></div>
      <div class="dot" style="background:var(--indigo)"></div>
      <div class="dot" style="background:var(--indigo)"></div>
      <span>Fotoğraflar sıkıştırılıyor...</span>
    </div>
  `);

  try {
    // Fotoğrafları sıkıştır
    const compressed = await Promise.all(
      clothes.map(async c => ({
        ...c,
        photo: c.photo ? await compressForShare(c.photo) : null
      }))
    );

    const payload = JSON.stringify({ v:1, clothes: compressed, outfits, shopping, wornLog, me });
    const kb = Math.round(new Blob([payload]).size / 1024);
    const photoCount = compressed.filter(c => c.photo).length;

    // Mevcut kodu koru ya da yeni üret
    let code = S.get('dd-sharecode');
    if(!code) { code = genShareCode(); S.set('dd-sharecode', code); }

    // Buluta kaydet (shared=true → herkes okuyabilir)
    const result = await window.storage.set('dolap:' + code, payload, true);
    if(!result) throw new Error('Kayıt başarısız');

    document.querySelector('#modal .modal').innerHTML = `
      <div class="mhdr"><div class="mtitle">📤 Dolabı Paylaş</div><button class="mclose" onclick="closeModal()">✕</button></div>
      <div class="alert alert-sage" style="margin-bottom:16px;">
        <span>✅</span>
        <div><b>${clothes.length} kıyafet · ${photoCount} fotoğraf buluta kaydedildi</b>
        <div style="font-size:12px;margin-top:2px;">~${kb} KB</div></div>
      </div>
      <p style="font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.7;">
        Bu <b>6 haneli kodu</b> WhatsApp'ta gönder.<br>
        Karşı taraf uygulamada <b>"Kodu Yükle"</b> → kodu girer → dolabın açılır.
      </p>
      <div style="background:var(--indigo-bg);border:2px solid var(--indigo-line);border-radius:var(--r);padding:18px;text-align:center;margin-bottom:14px;">
        <div style="font-size:11px;font-weight:600;color:var(--indigo);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Paylaşım Kodu</div>
        <div style="font-family:'Playfair Display',serif;font-size:40px;font-weight:600;letter-spacing:8px;color:var(--ink);">${code}</div>
      </div>
      <div class="ff" style="margin-top:0;padding-top:0;border:none;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="closeModal()">Kapat</button>
        <button class="btn btn-ghost" onclick="renewShareCode()" style="font-size:12px;">🔄 Yeni kod üret</button>
        <button class="btn btn-dark" onclick="
          navigator.clipboard.writeText('${code}')
            .then(()=>toast('📋 Kod kopyalandı: ${code}'))
            .catch(()=>toast('Kod: ${code}'));
        ">📋 Kodu Kopyala</button>
      </div>
      <div style="font-size:11px;color:var(--ink3);margin-top:11px;line-height:1.6;">
        💡 Dolabında değişiklik yaparsan tekrar "Paylaş" butonuna bas — aynı kod güncellenir.
      </div>
    `;
  } catch(e) {
    document.querySelector('#modal .modal').innerHTML = `
      <div class="mhdr"><div class="mtitle">📤 Dolabı Paylaş</div><button class="mclose" onclick="closeModal()">✕</button></div>
      <div class="alert alert-rose"><span>❌</span><div><b>Kayıt başarısız</b><div style="font-size:12px;margin-top:2px;">${e.message||'Tekrar dene'}</div></div></div>
      <div class="ff"><button class="btn btn-ghost" onclick="closeModal()">Kapat</button><button class="btn btn-dark" onclick="closeModal();renderSharePanel()">↻ Tekrar dene</button></div>
    `;
  }
}

window.renewShareCode = async () => {
  const code = genShareCode();
  S.set('dd-sharecode', code);
  toast('🔄 Yeni kod üretiliyor...');
  closeModal();
  await renderSharePanel();
};

function tab(t, btn) {
  if(isGuest) return;
  curTab = t;
  document.querySelectorAll('.dsk-nav button,.bnav button').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll(`[onclick*="tab('${t}'"]`).forEach(b=>b.classList.add('on'));
  document.getElementById('searchBox').style.display = t==='wardrobe' ? 'block' : 'none';
  document.getElementById('searchIn').value = '';
  if(t==='wardrobe') curFilter='Hepsi';
  ({add:renderAdd,bulk:renderBulk,wardrobe:renderWardrobe,outfit:renderOutfit,calendar:renderCalendar,shopping:renderShopping,insights:renderInsights,stats:renderStats})[t]?.();
}

    <div class="fi" style="margin-bottom:18px;"><label>Avatar seç</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;" id="obE"></div></div>
    <button class="btn btn-dark" style="width:100%;justify-content:center;" onclick="finishOnboard()">Başla →</button>
  `);
  let sel='👤';
  const grid=document.getElementById('obE');
  EMOJIS.forEach(em=>{
    const b=document.createElement('button');
    b.style.cssText='font-size:21px;width:38px;height:38px;border-radius:50%;border:2px solid transparent;background:var(--cream);cursor:pointer;';
    b.textContent=em;
    if(em===sel)b.style.borderColor='var(--ink)';
    b.onclick=()=>{grid.querySelectorAll('button').forEach(x=>x.style.borderColor='transparent');b.style.borderColor='var(--ink)';sel=em;};
    grid.appendChild(b);
  });
  window.finishOnboard=()=>{
    const n=document.getElementById('obN').value.trim();
    if(!n){toast('⚠️ İsim gerekli!');return;}
    me={name:n,emoji:sel}; S.set(KEYS.user,me);
    document.getElementById('hname').textContent=n;
    document.getElementById('hav').textContent=sel;
    closeModal();
  };
}

async function init() {
  // Önce paylaşım modunu kontrol et
  const shared = await tryLoadShared();

  // Normal mod
  if(me){ document.getElementById('hname').textContent=me.name; document.getElementById('hav').textContent=me.emoji; }
  tab('add', document.querySelector('.dsk-nav button'));
  checkNotif();
  if(!me) setTimeout(showOnboard, 400);
}

function resizeImg(file,max=800,q=0.75){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',q));
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function analyzeImg(b64){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,
      messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64.split(',')[1]}},
        {type:'text',text:`Bu kıyafeti analiz et. SADECE JSON formatında yanıt ver:\n{"isim":"...","kategori":"...","renk":"...","marka":"...","mevsim":""}\nKategori: ${CATS.join(', ')}\nMarka bilinmiyorsa boş. Mevsim: "İlkbahar / Yaz", "Sonbahar / Kış" veya boş.`}
      ]}]})});
  const d=await r.json();
  return JSON.parse(d.content?.map(x=>x.text||'').join('').replace(/```json|```/g,'').trim());
}

window.loadAndDetect=async e=>{
  const f=e.target.files[0];if(!f)return;
  const b64=await resizeImg(f);photoData=b64;
  const prev=document.getElementById('prev');
  if(prev){prev.src=b64;prev.style.display='block';}
  document.getElementById('pph').style.display='none';
  const st=document.getElementById('aiSt');if(st)st.style.display='flex';
  try{
    const p=await analyzeImg(b64);
    const fn=document.getElementById('fn');if(fn&&!fn.value)fn.value=p?.isim||'';
    const fc=document.getElementById('fc');if(fc){const m=CATS.find(c=>c.toLowerCase().includes((p?.kategori||'').toLowerCase()));if(m)fc.value=m;}
    const fr=document.getElementById('fr');if(fr&&!fr.value)fr.value=p?.renk||'';
    const fm=document.getElementById('fm');if(fm&&!fm.value)fm.value=p?.marka||'';
    const fs=document.getElementById('fs');if(fs&&p?.mevsim)fs.value=p.mevsim;
    toast('✨ AI kıyafeti tanıdı!');
  }catch{toast('⚠️ AI tanıyamadı, manuel doldur');}
  finally{if(st)st.style.display='none';}
};

function filterC(list,f){
  if(f==='Eski (3+ yıl)')return list.filter(c=>!c.stored&&isOld(c));
  if(f==='30+ gün giyilmedi')return list.filter(c=>!c.stored&&(daysWorn(c)===null||daysWorn(c)>=30));
  if(f==='Sandıkta')return list.filter(c=>c.stored);
  if(f!=='Hepsi')return list.filter(c=>!c.stored&&c.cat===f);
  return list;
}

window.markW=id=>{

  else{c._pw=c.lastWorn;c.lastWorn=t;c.wornCount=(c.wornCount||0)+1;if(!wornLog[t])wornLog[t]=[];if(!wornLog[t].includes(id))wornLog[t].push(id);}

function renderCalendar(){
  const now=new Date();let cy=now.getFullYear(),cm=now.getMonth();
  function draw(){
    const firstDay=new Date(cy,cm,1).getDay(),dim=new Date(cy,cm+1,0).getDate();
    const mName=new Date(cy,cm,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
    const todayStr=today();const days=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
    const offset=(firstDay+6)%7;let cells='';
    for(let i=0;i<offset;i++)cells+=`<div></div>`;
    for(let d=1;d<=dim;d++){const ds=`${cy}-${String(cm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const log=wornLog[ds]||[];const isT=ds===todayStr;const emojis=log.map(id=>{const c=clothes.find(x=>x.id===id);return c?CE[c.cat]||'👚':''}).filter(Boolean).slice(0,3).join('');cells+=`<div class="cal-day${log.length?' has-outfit':''}${isT?' today':''}" onclick="showDay('${ds}')"><div class="dn">${d}</div>${emojis?`<div class="de">${emojis}</div>`:''}</div>`;}
    document.getElementById('calW').innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"><button class="btn btn-ghost btn-sm" onclick="prevM()">‹ Önceki</button><div style="font-size:14px;font-weight:600;">${mName}</div><button class="btn btn-ghost btn-sm" onclick="nextM()">Sonraki ›</button></div><div class="cal-hdr">${days.map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-grid">${cells}</div><div style="margin-top:14px;display:flex;gap:11px;font-size:12px;color:var(--ink2);"><span><span style="display:inline-block;width:9px;height:9px;background:var(--indigo-bg);border:1px solid var(--indigo-line);border-radius:2px;margin-right:4px;"></span>Giyildi</span><span><span style="display:inline-block;width:9px;height:9px;border:1.5px solid var(--ink);border-radius:2px;margin-right:4px;"></span>Bugün</span></div>`;
  }
  document.getElementById('page').innerHTML=`<div class="shdr"><div class="stitle">Giyim Takvimi</div></div><div class="card"><div id="calW"></div></div>`;
  draw();
  window.prevM=()=>{cm--;if(cm<0){cm=11;cy--;}draw();};
  window.nextM=()=>{cm++;if(cm>11){cm=0;cy++;}draw();};
  window.showDay=ds=>{const log=wornLog[ds]||[];const label=new Date(ds+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});const items=log.map(id=>clothes.find(c=>c.id===id)).filter(Boolean);openModal(`<div class="mhdr"><div class="mtitle">📅 ${label}</div><button class="mclose" onclick="closeModal()">✕</button></div>${items.length?`<div style="display:flex;flex-direction:column;gap:8px;">${items.map(item=>`<div style="display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:var(--rs);padding:9px 12px;border:1px solid var(--line);">${item.photo?`<img src="${item.photo}" style="width:42px;height:42px;object-fit:cover;border-radius:var(--rs);flex-shrink:0;">`:`<div style="width:42px;height:42px;background:var(--line);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">${CE[item.cat]||'👚'}</div>`}<div><div style="font-size:13px;font-weight:600;">${item.name}</div><div style="font-size:11px;color:var(--ink3);">${item.cat}${item.color?' · '+item.color:''}</div></div></div>`).join('')}</div>`:`<div style="text-align:center;padding:28px;color:var(--ink3);font-size:14px;">Bu gün için kayıt yok.</div>`}`);};
}

async function renderInsights(){
  const active=clothes.filter(c=>!c.stored);
  const unworn=active.filter(c=>{const d=daysWorn(c);return d===null||d>=30;});
  const withPrice=active.filter(c=>c.buyPrice&&c.wornCount>0).sort((a,b)=>cpw(a)-cpw(b));

  const rotPct=active.length?Math.round((active.filter(c=>c.wornCount>0).length/active.length)*100):0;
  const totalSp=clothes.reduce((s,c)=>s+(Number(c.buyPrice)||0),0);
  const totalW=clothes.reduce((s,c)=>s+(c.wornCount||0),0);
  const avgCpw=totalSp&&totalW?Math.round(totalSp/totalW):null;
  document.getElementById('page').innerHTML=`

    <div class="igrid">
      <div class="ic rose"><div class="iico">😴</div><div class="ititle">${unworn.length} kıyafet uyuyor</div><div class="ibody">30+ gündür giyilmemiş.</div></div>
      <div class="ic sage"><div class="iico">🔄</div><div class="ititle">%${rotPct} rotasyon</div><div class="ibody">${active.filter(c=>c.wornCount>0).length}/${active.length} kıyafet en az bir kez giyildi.</div></div>
      ${avgCpw?`<div class="ic indigo"><div class="iico">💰</div><div class="ititle">Giyim başı ${fmtP(avgCpw)}</div><div class="ibody">Ortalama maliyet.</div></div>`:''}
    </div>
    ${mostWorn.length?`<div class="card" style="margin-bottom:14px;"><div class="ctitle">⭐ En çok giyilenler</div><div style="display:flex;flex-direction:column;gap:7px;margin-top:11px;">${mostWorn.map((item,i)=>`<div style="display:flex;align-items:center;gap:11px;padding:8px 11px;background:var(--cream);border-radius:var(--rs);border:1px solid var(--line);"><div style="width:24px;height:24px;border-radius:50%;background:${['var(--amber-bg)','var(--line)','var(--line)'][i]};border:1px solid ${['var(--amber-line)','var(--line2)','var(--line2)'][i]};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${['var(--amber)','var(--ink2)','var(--ink3)'][i]};flex-shrink:0;">${i+1}</div>${item.photo?`<img src="${item.photo}" style="width:38px;height:38px;object-fit:cover;border-radius:var(--rs);flex-shrink:0;">`:`<div style="width:38px;height:38px;background:var(--line);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">${CE[item.cat]||'👚'}</div>`}<div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:600;">${item.name}</div><div style="font-size:11px;color:var(--ink3);">${item.wornCount} kez</div></div></div>`).join('')}</div></div>`:''}
    ${withPrice.length?`<div class="card"><div class="ctitle">💸 Maliyet-Per-Giyim</div><div class="cpwl" style="margin-top:13px;">${withPrice.slice(0,8).map((item,i)=>{const v=cpw(item);const col=v<50?'var(--sage)':v<150?'var(--amber)':'var(--rose)';const bg=v<50?'var(--sage-bg)':v<150?'var(--amber-bg)':'var(--rose-bg)';return`<div class="cpwi"><div class="cpwr" style="background:${bg};color:${col};">${i+1}</div>${item.photo?`<img src="${item.photo}" style="width:38px;height:38px;object-fit:cover;border-radius:var(--rs);flex-shrink:0;">`:`<div style="width:38px;height:38px;background:var(--cream);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">${CE[item.cat]||'👚'}</div>`}<div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:600;">${item.name}</div><div style="font-size:11px;color:var(--ink3);">${fmtP(item.buyPrice)} ÷ ${item.wornCount} giyim</div></div><div style="font-size:14px;font-weight:700;color:${col};flex-shrink:0;">${fmtP(v)}</div></div>`;}).join('')}</div></div>`:''}
    <div class="card"><div class="ctitle">🎯 Kapsül Gardırop Analizi</div><div class="csub">AI dolabını analiz etsin.</div><button class="btn btn-dark" onclick="getCapsule()" id="capBtn">✨ Analizi başlat</button><div id="capRes"></div></div>`;
}
window.getCapsule=async()=>{
  const btn=document.getElementById('capBtn'),res=document.getElementById('capRes');
  btn.disabled=true;btn.textContent='Analiz ediliyor...';
  res.innerHTML='<div style="display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:13px;padding:18px 0;"><div class="dot" style="background:var(--indigo)"></div><div class="dot" style="background:var(--indigo)"></div><div class="dot" style="background:var(--indigo)"></div></div>';
  const list=clothes.filter(c=>!c.stored).map(c=>`${c.name}|${c.cat}${c.color?'|'+c.color:''}${c.season?'|'+c.season:''}|${c.wornCount||0}x`).join('\n');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:`Moda uzmanı olarak bu dolabı analiz et:\n${list}\n\nTürkçe, kısa ve pratik:\n1. Tahmini kombin sayısı\n2. Eksik 3 temel parça\n3. Fazlalık/benzer parçalar\n4. En işlevsel 10 parça önerisi`}]})});
    const d=await r.json();const txt=d.content?.map(x=>x.text||'').join('')||'';
    res.innerHTML=`<div style="background:var(--cream);border-radius:var(--rs);border-left:3px solid var(--indigo-line);padding:13px 15px;font-size:13px;line-height:1.9;color:var(--ink2);margin-top:14px;">${txt.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')}</div>`;
  }catch{res.innerHTML='<div style="color:var(--rose);font-size:13px;padding:12px 0;">⚠️ Analiz başarısız.</div>';}
  finally{btn.disabled=false;btn.textContent='✨ Analizi başlat';}
};

// ── STATS ─────────────────────────────────────
function renderStats(){
  const yr=currYear();
  const cats={};clothes.forEach(c=>{cats[c.cat]=(cats[c.cat]||0)+1;});
  const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const max=sorted[0]?.[1]||1;
  const unworn=clothes.filter(c=>!c.stored&&(daysWorn(c)===null||daysWorn(c)>=30));
  const spent=totalSpent();
  const cols=['var(--indigo)','var(--rose)','var(--sage)','var(--amber)','var(--indigo)','var(--sage)','var(--rose)'];
  const stats=[[clothes.length,'Toplam parça'],[clothes.filter(c=>!c.stored).length,'Aktif'],[clothes.filter(c=>c.stored).length,'Depoda'],[clothes.filter(isOld).length,'3+ yıllık'],[clothes.filter(c=>c.date&&new Date(c.date).getFullYear()===yr).length,'Bu yıl alınan'],[unworn.length,'30+ gün giyilmedi'],[outfits.length,'Kayıtlı kombin']];
  document.getElementById('page').innerHTML=`
    ${yearBudget()?`<div class="card" style="margin-bottom:15px;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;"><div class="ctitle">Bütçe ${yr}</div><button class="btn btn-ghost btn-sm" onclick="setBudget()">✏️ Düzenle</button></div><div style="display:flex;justify-content:space-between;margin-bottom:9px;font-size:14px;"><span style="color:var(--ink2);">Harcanan</span><b>${fmtP(spent)} / ${fmtP(yearBudget())}</b></div><div class="bpbar-wrap"><div class="bpbar" style="width:${Math.min(100,Math.round(spent/yearBudget()*100))}%;background:${budgetLeft()<0?'var(--rose)':budgetLeft()<yearBudget()*.2?'var(--amber)':'var(--sage)'};"></div></div></div>`:''}
    <div class="sgrid">${stats.map(([n,l],i)=>`<div class="sbox"><div class="sbox-accent" style="background:${cols[i]};"></div><div class="snum">${n}</div><div class="slbl">${l}</div></div>`).join('')}</div>
    <div class="catlist"><div style="font-size:15px;font-weight:600;margin-bottom:14px;">Kategoriye göre dağılım</div>${sorted.length?sorted.map(([cat,cnt],i)=>`<div class="catrow"><div class="catname">${CE[cat]||''} ${cat}</div><div class="catbg"><div class="catfill" style="width:${Math.round(cnt/max*100)}%;background:${CCOLS[i%CCOLS.length]};"></div></div><div class="catcnt">${cnt}</div></div>`).join(''):'<p style="color:var(--ink3);font-size:13px;">Kıyafet yok.</p>'}</div>`;
}

// ── USER & NOTIF ──────────────────────────────
function checkNotif(){
  const u=clothes.filter(c=>!c.stored&&(daysWorn(c)===null||daysWorn(c)>=30));
  document.getElementById('ndot').classList.toggle('on',u.length>0);
}
window.openNotif=()=>{
  const u=clothes.filter(c=>!c.stored&&(daysWorn(c)===null||daysWorn(c)>=30));
  openModal(`<div class="mhdr"><div class="mtitle">🔔 Bildirimler</div><button class="mclose" onclick="closeModal()">✕</button></div>${u.length?`<div class="alert alert-amber"><span>😴</span><div><b>${u.length} kıyafet 30+ gündür giyilmedi</b><ul style="margin-top:6px;padding-left:15px;font-size:13px;">${u.slice(0,5).map(c=>`<li>${c.name}</li>`).join('')}${u.length>5?`<li style="color:var(--ink3);">+${u.length-5} tane daha</li>`:''}</ul></div></div>`:'<div style="text-align:center;padding:20px;color:var(--ink2);font-size:14px;">✅ Her şey yolunda!</div>'}`);
};
window.openUser=()=>{
  if(isGuest){ toast('👁 Görüntüleme modundasın'); return; }
  openModal(`
    <div class="mhdr"><div class="mtitle">${me?.emoji||'👤'} ${me?.name||'Kullanıcı'}</div><button class="mclose" onclick="closeModal()">✕</button></div>
    <div style="font-size:13px;color:var(--ink2);margin-bottom:16px;">${clothes.length} kıyafet · ${outfits.length} kombin · ${shopping.filter(i=>!i.bought).length} alışveriş</div>
    <button class="btn btn-indigo" style="width:100%;justify-content:center;margin-bottom:8px;" onclick="closeModal();renderSharePanel()">📤 Dolabı Paylaş</button>
    <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-bottom:8px;" onclick="closeModal();showLoadCode()">📥 Kodu Yükle</button>
    <button class="btn btn-rose" style="width:100%;justify-content:center;" onclick="clearAll()">🗑 Tüm verileri sil</button>
  `);
};

window.showLoadCode = () => {
  openModal(`
    <div class="mhdr"><div class="mtitle">📥 Kodu Yükle</div><button class="mclose" onclick="closeModal()">✕</button></div>
    <p style="font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.7;">
      Sana gönderilen <b>6 haneli kodu</b> gir:
    </p>
    <input id="loadCode" type="text" maxlength="6"
      style="width:100%;text-align:center;font-family:'Playfair Display',serif;font-size:36px;font-weight:600;letter-spacing:10px;text-transform:uppercase;padding:14px;border:2px solid var(--line2);border-radius:var(--r);background:var(--cream);outline:none;"
      placeholder="A3K9X2"
      oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')"
      onkeydown="if(event.key==='Enter')doLoadCode()">
    <div id="loadErr" style="display:none;color:var(--rose);font-size:12px;margin-top:8px;text-align:center;"></div>
    <div class="alert alert-amber" style="margin-top:12px;">
      <span>⚠️</span>
      <div style="font-size:12px;"><b>Mevcut veriler silinecek.</b></div>
    </div>
    <div class="ff" style="margin-top:13px;padding-top:13px;">
      <button class="btn btn-ghost" onclick="closeModal()">İptal</button>
      <button class="btn btn-dark" id="loadBtn" onclick="doLoadCode()">✅ Yükle</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('loadCode')?.focus(), 100);
};

window.doLoadCode = async () => {
  const code = document.getElementById('loadCode')?.value.trim().toUpperCase();
  const errEl = document.getElementById('loadErr');
  const btn = document.getElementById('loadBtn');
  if(!code || code.length !== 6) {
    errEl.style.display='block'; errEl.textContent='⚠️ 6 haneli kod gir!'; return;
  }
  errEl.style.display='none';
  btn.textContent='⏳ Yükleniyor...'; btn.disabled=true;
  try {
    const result = await window.storage.get('dolap:' + code, true); // shared=true
    if(!result) {
      errEl.style.display='block';
      errEl.textContent='❌ Kod bulunamadı. Doğru yazdığından emin ol.';
      btn.textContent='✅ Yükle'; btn.disabled=false; return;
    }
    const data = JSON.parse(result.value);
    if(!Array.isArray(data.clothes)) throw new Error('Geçersiz veri');
    clothes = data.clothes || [];
    outfits = data.outfits || [];
    shopping = data.shopping || [];
    wornLog = data.wornLog || {};
    if(data.me){ me = data.me; S.set(KEYS.user, me); document.getElementById('hname').textContent=me.name; document.getElementById('hav').textContent=me.emoji; }
    save(); isGuest = false;
    const photoCount = clothes.filter(c=>c.photo).length;
    closeModal(); checkNotif();
    toast(`✅ ${clothes.length} kıyafet ve ${photoCount} fotoğraf yüklendi!`);
    tab('wardrobe', document.querySelectorAll('.dsk-nav button')[2]);
  } catch(e) {
    errEl.style.display='block';
    errEl.textContent='❌ Yükleme başarısız: ' + (e.message||'Tekrar dene');
    btn.textContent='✅ Yükle'; btn.disabled=false;
  }
};
window.clearAll=()=>{if(!confirm('TÜM veriler silinecek. Emin misin?'))return;if(!confirm('Geri alınamaz! Devam et?'))return;clothes=[];outfits=[];shopping=[];wornLog={};save();closeModal();tab('wardrobe',document.querySelectorAll('.dsk-nav button')[2]);toast('🗑 Silindi');};

// ── BOOT ──────────────────────────────────────
init();
</script>
</body>
</html>
